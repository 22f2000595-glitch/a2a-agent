services:
  - type: web
    name: invoice-action-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /.well-known/agent-card.json
    envVars:
      - key: A2A_BASE_URL
        value: https://invoice-action-agent.onrender.com/a2a/
      - key: A2A_BEARER_TOKEN
        generateValue: true
      - key: AI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: invoice-agent-db
          property: connectionString
      - key: AI_MODEL
        value: gpt-4o-mini

databases:
  - name: invoice-agent-db
    databaseName: invoice_agent
    plan: free
